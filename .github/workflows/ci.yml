name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy strict typecheck
        run: mypy klipper_usb_load

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run pytest suite
        run: pytest -v

  shell-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck and validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck sudo udev
      - name: Check bash syntax and ShellCheck
        run: |
          chmod +x install.sh uninstall.sh scripts/klipper-usb-load-helper scripts/klipper-usb-load-notify tests/test_install_dryrun.sh
          bash -n install.sh uninstall.sh scripts/klipper-usb-load-helper scripts/klipper-usb-load-notify tests/test_install_dryrun.sh
          shellcheck install.sh uninstall.sh scripts/klipper-usb-load-helper scripts/klipper-usb-load-notify tests/test_install_dryrun.sh
      - name: Validate sudoers template with visudo
        run: |
          sed 's/@USER@/pi/g' scripts/klipper-usb-load.sudoers.template > /tmp/klipper-usb-load.sudoers
          sudo visudo -cf /tmp/klipper-usb-load.sudoers
      - name: Verify udev rules syntax when supported
        run: |
          if udevadm verify --help >/dev/null 2>&1; then
            udevadm verify scripts/99-klipper-usb-load.rules
          fi
      - name: Run isolated install and uninstall dry-run test
        run: bash tests/test_install_dryrun.sh
