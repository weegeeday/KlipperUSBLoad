# Optional KlipperUSBLoad LCD Menu entry
# Include in printer.cfg ONLY if your printer has a [display] section:
#   [include klipper_usb_load_lcd.cfg]

[menu __main __print_usb]
type: command
index: 0
enable: {printer.idle_timeout.state != "Printing" and (printer.print_stats.state|default("standby")|lower not in ["printing", "paused"] if printer.print_stats is defined else True) and printer["gcode_macro _USB_LOAD_STATE"].ready|int == 1 and printer["gcode_macro _USB_LOAD_STATE"].filename != ""}
name: USB: {printer["gcode_macro _USB_LOAD_STATE"].display_name[:12]}
gcode:
  {menu.exit()}
  PRINT_NEWEST_USB
