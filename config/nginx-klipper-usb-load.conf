# Optional Nginx location snippet for Mainsail/Fluidd reverse proxy
# Include inside your Mainsail/Fluidd server {} block (e.g. /etc/nginx/sites-available/mainsail):
#
#   include /etc/nginx/conf.d/klipper-usb-load.conf;
#
# Then visit http://<printer-ip>/usb-load/ or add a custom link to /usb-load/ in Mainsail.

location = /usb-load {
    return 301 /usb-load/;
}

location /usb-load/ {
    proxy_pass http://127.0.0.1:7125/server/klipper_usb_load/ui/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
