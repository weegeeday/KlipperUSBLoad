# KlipperUSBLoad Mainsail UI integration (installed in /etc/nginx/conf.d/)
# Injects KlipperUSBLoad's Dashboard panel and Sidebar tab into Mainsail
# without modifying /home/pi/mainsail (keeping Mainsail updates clean).

sub_filter_types text/html;
sub_filter_once on;
sub_filter '</body>' '<script type="module" src="/server/klipper_usb_load/ui/mainsail-plugin.js"></script></body>';
