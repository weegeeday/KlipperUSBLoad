# KlipperUSBLoad core macros
# Include in printer.cfg:
#   [include klipper_usb_load.cfg]

[gcode_macro _USB_LOAD_STATE]
description: Internal state populated by Moonraker klipper_usb_load component
variable_filename: ""
variable_display_name: ""
variable_ready: 0
variable_count: 0
variable_status: "No USB"
gcode:
  {% set state = printer["gcode_macro _USB_LOAD_STATE"] %}
  {action_respond_info("USB State: %s | Ready: %s | Files: %s | Newest: %s" % (state.status, state.ready, state.count, state.filename))}

[gcode_macro _USB_LOAD_SET_STATE]
description: Called by Moonraker klipper_usb_load to update newest USB G-code state
gcode:
  {% set filename = params.FILENAME|default("")|string|replace("\\", "\\\\")|replace("'", "\\'") %}
  {% set display_name = params.DISPLAY_NAME|default("")|string|replace("\\", "\\\\")|replace("'", "\\'") %}
  {% set ready = params.READY|default(0)|int %}
  {% set count = params.COUNT|default(0)|int %}
  {% set status = params.STATUS|default("No USB")|string|replace("\\", "\\\\")|replace("'", "\\'") %}
  SET_GCODE_VARIABLE MACRO=_USB_LOAD_STATE VARIABLE=filename VALUE="'{filename}'"
  SET_GCODE_VARIABLE MACRO=_USB_LOAD_STATE VARIABLE=display_name VALUE="'{display_name}'"
  SET_GCODE_VARIABLE MACRO=_USB_LOAD_STATE VARIABLE=ready VALUE={ready}
  SET_GCODE_VARIABLE MACRO=_USB_LOAD_STATE VARIABLE=count VALUE={count}
  SET_GCODE_VARIABLE MACRO=_USB_LOAD_STATE VARIABLE=status VALUE="'{status}'"

[gcode_macro _USB_LOAD_NOTIFY]
description: Display KlipperUSBLoad status message on LCD (M117)
gcode:
  {% set msg = params.MSG|default("")|string %}
  {% if msg %}
    M117 {msg}
  {% endif %}

[gcode_macro PRINT_NEWEST_USB]
description: Start printing the newest fully indexed G-code file on USB
gcode:
  {% set usb = printer["gcode_macro _USB_LOAD_STATE"] %}
  {% set print_state = printer.print_stats.state|default("standby")|lower if printer.print_stats is defined else "standby" %}
  {% if printer.idle_timeout.state == "Printing" or print_state in ["printing", "paused"] %}
    M117 Printer busy
    {action_raise_error("Cannot start USB print while printer is %s" % print_state)}
  {% elif usb.ready|int != 1 or not usb.filename %}
    M117 No USB G-code ready
    {action_raise_error("No ready USB G-code file is available")}
  {% else %}
    M117 Printing {usb.display_name[:16]}
    SDCARD_PRINT_FILE FILENAME="{usb.filename}"
  {% endif %}
